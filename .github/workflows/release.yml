name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linux: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            linux: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            linux: false
          - runner: macos-14
            target: aarch64-apple-darwin
            linux: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.linux }}
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.linux }}
      - name: Build static Linux binary
        if: ${{ matrix.linux }}
        run: |
          docker run --rm \
            -e CARGO_TARGET_DIR=/work/target/linux-static \
            -v "$PWD:/work" -w /work \
            rust:1.88-alpine \
            sh -c 'apk add --no-cache musl-dev && cargo build --locked --release'
          cp target/linux-static/release/resync "resync-${{ matrix.target }}"
      - name: Verify static Linux binary
        if: ${{ matrix.linux }}
        run: |
          file "resync-${{ matrix.target }}" | grep -Eq 'static-pie linked|statically linked'
          ! readelf -l "resync-${{ matrix.target }}" | grep -q 'Requesting program interpreter'
          "./resync-${{ matrix.target }}" --version
      - name: Build native macOS binary
        if: ${{ !matrix.linux }}
        run: |
          cargo build --locked --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/resync" "resync-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: resync-${{ matrix.target }}
          path: resync-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: resync-*
          path: dist
          merge-multiple: true
      - name: Validate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          for manifest in npm/*/package.json; do
            test "$(node -p "require('./$manifest').version")" = "$version"
          done
      - name: Create checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod 755 dist/resync-*
          (cd dist && sha256sum resync-* > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi
