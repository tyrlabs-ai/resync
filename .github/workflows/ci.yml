name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static Linux binary
        run: |
          docker run --rm \
            -e CARGO_TARGET_DIR=/work/target/linux-static \
            -v "$PWD:/work" -w /work \
            rust:1.88-alpine \
            sh -c 'apk add --no-cache musl-dev && cargo build --locked --release'
      - name: Verify static Linux binary
        run: |
          file target/linux-static/release/resync | grep -Eq 'static-pie linked|statically linked'
          ! readelf -l target/linux-static/release/resync | grep -q 'Requesting program interpreter'
          target/linux-static/release/resync --version

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
